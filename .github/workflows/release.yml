name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# softprops/action-gh-release needs contents:write to create the Release.
# The default GITHUB_TOKEN no longer has this permission since GitHub's
# 2023 security tightening — declare it explicitly here.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Rust toolchain is pre-installed on windows-latest, but add the MSVC
      # target defensively so `tauri build` doesn't fail if GitHub ever
      # changes the runner image.
      - name: Ensure Rust MSVC target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Verify tag matches canonical version
        run: python scripts/release_check.py "${{ github.ref_name }}"

      - name: Install Python deps (sidecar + csm_core editable)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
          pip install -e ./sidecar

      # NOTE: 到 v0.8.0 为止这里有一步 "Inject PAT into _token.py"，把
      # CSM_RELEASE_PAT 烙进安装包给私有仓库时代的更新检查用。仓库转
      # public 后 token 不再必要，且烙死的 PAT 过期时会让**所有装机**同时
      # 更新检查 401（GitHub 对无效凭证不降级匿名，2026-09 实锤全员故障）。
      # 自 v0.8.1 起发布包不带 token，一律匿名读 release。私有分叉自行
      # 恢复注入即可（_token.py 机制仍在，见 updater_service._read_release_token）。

      # Patchright bundles its Node driver, but **not** the Chromium browser
      # binary itself — that gets downloaded into %LOCALAPPDATA%\ms-playwright
      # by `patchright install chromium`. Dev machines have it from a one-time
      # local install; fresh user machines installing the NSIS package don't.
      # Without this step, every patchright launch (cookie login, baidu login,
      # mining browser, comment scraping) fails with "Executable doesn't exist"
      # — user-visible as "评论弹窗错误", "登录窗口打不开", "百度账号无法登陆".
      # We download once into the runner, then ship the chromium-XXXX/ folder
      # via Tauri bundle.resources so it lands next to the installed sidecar.
      - name: Install Patchright Chromium
        run: python -m patchright install chromium

      # Stage the Chromium folder where Tauri's bundler picks it up. Only
      # chromium-XXXX/ — skip chromium_headless_shell-* (we headed-launch
      # everywhere; bundling adds ~100 MB for code paths we don't hit) and
      # any ffmpeg-* / winldd-* helpers patchright drops in the same dir.
      # If a future code path needs headless-shell, surface the bug and add
      # it explicitly rather than blanket-bundling the whole 2 GB cache.
      - name: Stage Chromium into Tauri resources
        shell: pwsh
        run: |
          $src = "$env:LOCALAPPDATA\ms-playwright"
          $dst = "frontend\src-tauri\binaries\ms-playwright"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $chromiumDirs = Get-ChildItem $src -Directory -Filter "chromium-*" |
            Where-Object { $_.Name -notlike "*headless*" }
          if (-not $chromiumDirs) {
            Write-Error "no chromium-XXXX/ dir found under $src — patchright install failed?"
            exit 1
          }
          foreach ($d in $chromiumDirs) {
            Copy-Item -Path $d.FullName -Destination $dst -Recurse -Force
          }
          $totalSize = (Get-ChildItem $dst -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("staged chromium: {0:N0} bytes ({1:N1} MB)" -f $totalSize, ($totalSize / 1MB))

      # ── PyInstaller onefile artifacts that get bundled into Tauri ─────
      # build_sidecar.py drops the exe under frontend/src-tauri/binaries/
      # with the Tauri host-triple suffix (csm-sidecar-x86_64-pc-windows-msvc.exe).
      # build_updater.py drops updater.exe in the same dir as a Tauri resource.
      - name: Build sidecar (PyInstaller onefile)
        run: python scripts/build_sidecar.py --clean

      - name: Build updater (PyInstaller onefile)
        run: python scripts/build_updater.py --clean

      - name: Sanity check Tauri binaries dir
        shell: pwsh
        run: |
          $dir = "frontend/src-tauri/binaries"
          Get-ChildItem $dir | Format-Table -AutoSize
          if (-not (Test-Path "$dir/csm-sidecar-x86_64-pc-windows-msvc.exe")) {
            Write-Error "sidecar binary missing — build_sidecar.py output mismatch?"; exit 1
          }
          if (-not (Test-Path "$dir/updater.exe")) {
            Write-Error "updater.exe missing — build_updater.py output mismatch?"; exit 1
          }

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # tauri build produces both the NSIS installer .exe and the raw
      # release files (target/release/CSM.exe + WebView2Loader.dll +
      # binaries/ + resources/).
      - name: Build Tauri (NSIS bundle + raw release files)
        working-directory: frontend
        run: npm run tauri:build

      # Install the NSIS .exe silently to a staging dir, then zip that dir.
      # This guarantees the hot-update zip's layout == what a real
      # NSIS-installed copy looks like, so updater.exe's atomic-rename
      # logic doesn't trip over a path mismatch.
      #
      # NSIS `/S` is silent, `/D=` MUST be the last argument and unquoted
      # (those are NSIS rules; the wrapper accepts both spaces and not).
      - name: Stage NSIS install into D:\stage\CSM
        shell: pwsh
        run: |
          $nsis = Get-ChildItem `
            "frontend/src-tauri/target/release/bundle/nsis/CSM_*_x64-setup.exe" `
            | Select-Object -First 1
          if (-not $nsis) { Write-Error "NSIS installer not found"; exit 1 }
          Write-Host "Using installer: $($nsis.FullName)"
          $stage = "D:\stage\CSM"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Run synchronously and wait for exit. Start-Process avoids the
          # shell silently backgrounding setup.exe (NSIS detaches by default).
          $p = Start-Process -FilePath $nsis.FullName -ArgumentList "/S","/D=$stage" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "NSIS installer exited $($p.ExitCode)"; exit 1
          }
          Write-Host "── Staged contents:"
          Get-ChildItem $stage -Recurse | Select-Object FullName | Format-Table -AutoSize
          # 主 exe 的实际文件名来自 Cargo [[bin]].name (csm-tauri) 而非
          # tauri.conf.json 的 productName "CSM"。这是 v0.4.1 release CI
          # 第三跑摸出来的真实 NSIS 布局，跟我们最初的设计假设不一致。
          if (-not (Test-Path "$stage\csm-tauri.exe")) {
            Write-Error "Staging missing csm-tauri.exe — NSIS install failed silently?"; exit 1
          }
          if (-not (Test-Path "$stage\binaries\updater.exe")) {
            Write-Error "Staging missing binaries\updater.exe — Tauri resources 未写入"; exit 1
          }
          # v0.5.3: chromium 必须随 NSIS 装到 install dir，否则
          # patchright launch_persistent_context 会炸 "Executable doesn't exist"。
          # 校验目录存在且非空（至少 1 个 chromium-XXXX 子目录）。
          if (-not (Test-Path "$stage\binaries\ms-playwright")) {
            Write-Error "Staging missing binaries\ms-playwright — Chromium bundle didn't land in install dir"; exit 1
          }
          $chromiumDirs = Get-ChildItem "$stage\binaries\ms-playwright" -Directory -Filter "chromium-*" -ErrorAction SilentlyContinue
          if (-not $chromiumDirs) {
            Write-Error "Staging has binaries\ms-playwright but no chromium-XXXX/ inside — bundle.resources copied an empty dir"; exit 1
          }

      - name: Package hot-update zip
        shell: pwsh
        run: |
          # The zip's top-level dir must be "CSM" so updater.py finds a
          # single top-level entry and treats it as the new install root.
          Compress-Archive -Path "D:\stage\CSM" -DestinationPath "CSM-${{ github.ref_name }}.zip" -Force
          $size = (Get-Item "CSM-${{ github.ref_name }}.zip").Length
          Write-Host "zip size: $($size / 1MB | ForEach-Object { '{0:N1}' -f $_ }) MB"

      # 增量热更新包 = 完整安装布局去掉 binaries\ms-playwright。Chromium 约
      # 400 MB、只有升级 patchright 时才变，却占了完整 zip 的大头。新客户端
      # （支持增量包的版本）在本机已装同名 chromium-XXXX 目录时优先下载增量包，
      # updater.exe 换目录时把旧目录里的 ms-playwright 原样搬进新目录
      # （见 updater/main.py PRESERVE_DIRS）。后缀用 .upd 而不是 .zip：
      # ≤0.8.3 的老客户端按「第一个 .zip 资产」选包，绝不能让它们误拿到这个
      # 不带浏览器内核的包。
      - name: Package lite hot-update (without Chromium)
        shell: pwsh
        run: |
          $stage = "D:\stage\CSM"
          $liteRoot = "D:\stage-lite"
          $lite = "$liteRoot\CSM"
          if (Test-Path $liteRoot) { Remove-Item -Recurse -Force $liteRoot }
          New-Item -ItemType Directory -Force -Path $lite | Out-Null
          robocopy $stage $lite /E /XD "$stage\binaries\ms-playwright" /NFL /NDL /NJH /NJS | Out-Null
          # robocopy 的退出码是位标志：0–7 都算成功（1 = 有文件被复制，正是这里的常态），
          # >= 8 才是失败。GitHub 的 pwsh 包装器会在脚本末尾 `exit $LASTEXITCODE`，
          # 而后面全是 cmdlet、不会再改写它 —— 不清零的话这一步会以 1 退出、整个发版失败。
          if ($LASTEXITCODE -ge 8) { Write-Error "robocopy failed ($LASTEXITCODE)"; exit 1 }
          $global:LASTEXITCODE = 0
          if (Test-Path "$lite\binaries\ms-playwright") { Write-Error "lite stage still contains ms-playwright"; exit 1 }
          if (-not (Test-Path "$lite\csm-tauri.exe")) { Write-Error "lite stage missing csm-tauri.exe"; exit 1 }
          $dirs = (Get-ChildItem "$stage\binaries\ms-playwright" -Directory -Filter "chromium-*" | ForEach-Object { $_.Name }) -join ","
          if (-not $dirs) { Write-Error "no chromium-XXXX dir to record for the lite manifest"; exit 1 }
          "CHROMIUM_DIRS=$dirs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $zip = "CSM-${{ github.ref_name }}-lite.zip"
          $upd = "CSM-${{ github.ref_name }}-lite.upd"
          Compress-Archive -Path $lite -DestinationPath $zip -Force
          Move-Item -Force $zip $upd
          $size = (Get-Item $upd).Length
          Write-Host ("lite size: {0:N1} MB (chromium dirs: {1})" -f ($size / 1MB), $dirs)

      - name: Generate manifest.json
        run: python scripts/build_manifest.py --version "${{ github.ref_name }}" --zip "CSM-${{ github.ref_name }}.zip" --out manifest.json --lite-zip "CSM-${{ github.ref_name }}-lite.upd" --chromium-dirs "$env:CHROMIUM_DIRS"

      - name: Extract CHANGELOG section
        id: changelog
        shell: pwsh
        run: |
          # pwsh 把原生命令的多行 stdout 捕获成「字符串数组」，直接 "$body" 插值
          # 会按 $OFS（空格）拼成一行巨型文本（v0.7.1–v0.7.3 的 Release body 都
          # 被压成单行）。必须显式 -join 还原换行。
          $body = (python scripts/extract_changelog.py "${{ github.ref_name }}") -join "`n"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "extract_changelog.py failed (exit $LASTEXITCODE) — refusing to publish a release with an empty body"
            exit 1
          }
          $body = $body -replace "`r`n", "`n"
          $delim = "EOF_$(Get-Random)"
          "body<<$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$body"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$delim"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Find the NSIS .exe again (its filename includes the version) for the
      # release files list.
      - name: Locate NSIS installer for upload
        id: nsis
        shell: pwsh
        run: |
          $nsis = Get-ChildItem `
            "frontend/src-tauri/target/release/bundle/nsis/CSM_*_x64-setup.exe" `
            | Select-Object -First 1
          "path=$($nsis.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            CSM-${{ github.ref_name }}.zip
            CSM-${{ github.ref_name }}-lite.upd
            manifest.json
            ${{ steps.nsis.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
